<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Action Tracker</title>
  <style>
    body {
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px;
      font-family: system-ui, sans-serif;
      color: #222;
    }

    h1 {
      margin-bottom: 4px;
    }

    .summary {
      color: #666;
      margin-bottom: 24px;
    }

    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    button {
      padding: 8px 12px;
      cursor: pointer;
    }

    table {
      border-collapse: collapse;
      width: 100%;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #ddd;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #f5f5f5;
    }

    .status {
      border-radius: 4px;
      padding: 3px 7px;
      font-size: 0.85em;
      white-space: nowrap;
    }

    .open {
      background: #fff0c2;
    }

    .waiting {
      background: #dcecff;
    }

    .blocked {
      background: #ffd9d9;
    }

    .done, .cancelled {
      background: #dcf5df;
    }

    .muted {
      color: #777;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <h1>Action Tracker</h1>
  <div id="summary" class="summary">Loading...</div>

  <div class="filters">
    <button onclick="showStatus('open')">Open</button>
    <button onclick="showStatus('all')">All</button>
    <button onclick="showStatus('waiting')">Waiting</button>
    <button onclick="showStatus('blocked')">Blocked</button>
    <button onclick="showStatus('done')">Done</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Status</th>
        <th>Action</th>
        <th>Due</th>
        <th>Source</th>
      </tr>
    </thead>
    <tbody id="actions"></tbody>
  </table>

  <script src="app.js"></script>
</body>
</html>
